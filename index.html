<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>StockEase — Manajemen Inventaris UMKM</title>
    <meta
      name="description"
      content="StockEase adalah aplikasi manajemen inventaris untuk UMKM: kelola produk, pantau stok, catat transaksi barang masuk & keluar, dan dapatkan peringatan stok menipis secara real-time."
    />
    <meta name="keywords" content="inventaris, manajemen stok, UMKM, StockEase, transaksi barang, gudang" />
    <meta name="author" content="StockEase" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Font: Inter (preconnect untuk loading lebih cepat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StockEase — Manajemen Inventaris UMKM" />
    <meta
      property="og:description"
      content="Kelola produk, pantau stok, dan catat transaksi inventaris UMKM dengan mudah lewat StockEase."
    />
    <meta property="og:site_name" content="StockEase" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StockEase — Manajemen Inventaris UMKM" />
    <meta
      name="twitter:description"
      content="Kelola produk, pantau stok, dan catat transaksi inventaris UMKM dengan mudah lewat StockEase."
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "StockEase",
        "description": "Aplikasi manajemen inventaris untuk UMKM: kelola produk, pantau stok, dan catat transaksi barang masuk & keluar.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "id-ID",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "IDR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
